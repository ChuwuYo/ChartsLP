[project]
name = "chartslp"
version = "0.1.1"
description = "Candlestick chart pattern and trendline detection engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ChuwuYo" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartslp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Conservative: catch real bugs (F) and import hygiene (I). The pattern
# engine was not written to strict style rules; adding them here would
# produce churn without meaningful quality gains.
select = ["F", "I"]
ignore = ["F841"]  # unused locals kept for readability in test fixtures

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
